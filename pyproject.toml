[project]
name = "glyph-bridge"
version = "0.1.4"
description = "A utility to convert Google Fonts to C++ header files."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Power_Broker", email = "gitstuff2@gmail.com"}]
dependencies = [
    "requests",
    "matplotlib",
    "numpy",
    "pillow>=9.2",
    "typer>=0.16"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
glyph-bridge = "glyph_bridge.cli:main"

[project.gui-scripts]
glyph-bridge-gui = "glyph_bridge.gui:main"
